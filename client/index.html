<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>CodeMate</title>
        <meta
            name="description"
            content="Run live coding sessions with your class: one shared editor, real compilers, voice chat and raised hands."
        />
        <meta name="color-scheme" content="light dark" />
        <meta name="theme-color" content="#fafafa" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <script>
            // Applies the saved theme before first paint so the page never flashes the wrong colors.
            (function () {
                var saved = null;
                try {
                    saved = localStorage.getItem('codemate-theme');
                } catch (error) {}
                var dark =
                    saved === 'dark' ||
                    (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
                var root = document.documentElement;
                root.dataset.theme = dark ? 'dark' : 'light';
                root.style.colorScheme = dark ? 'dark' : 'light';
                document
                    .querySelector('meta[name="theme-color"]')
                    .setAttribute('content', dark ? '#0b0b0c' : '#fafafa');
            })();
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.jsx"></script>
    </body>
</html>
